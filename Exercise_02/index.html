<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic HTML Event Handler</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/Exercise_02/assets/js/index.js"></script>
  </head>
  <body>

    <!-- 
        Task: Add event to the dynamically added HTML tag button
        
        Currently, the button appears in the HTML after 5 seconds of the DOM loading
        but when we usually assign the event to the button it doesn't work because the HTML loads after the execution of the function
        which is why the click event never gets mounted to the button to call the click event

        Now, you need to add event to the button using JQuery which should show an alert when the button is clicked with button data-id value in the alert

        HINT: In jquery there is a way that is
        $('body').on(eventName (Mostly click event is used in this parameter), tagName/ClassName/Id/attribute, function() {
          // your code here
        });
        this event is bind to the body and when the button is clicked it triggers the event 
        doesn't matter if the button is dynamically added to the HTML or not

        You can learn more from the link below
        https://api.jquery.com/on/
    -->

    <div class="html-container container py-5 text-center"></div>
  </body>
</html>
